name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: docker build -t api . && docker run -d -p 8080:80 --name api api && sleep 1 && curl -fsS localhost:8080/char-generator/health
